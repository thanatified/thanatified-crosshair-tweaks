name: build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ⭐ FIRST BUILD — forces Loom to download Minecraft
      - name: First build (download Minecraft)
        run: ./gradlew build --refresh-dependencies || true

      # ⭐ DEBUG STEP 1 — locate Framebuffer.class
      - name: Locate Framebuffer
        run: |
          echo "Searching for Framebuffer.class..."
          find ~/.gradle -name "Framebuffer.class" -print || echo "Framebuffer not found"

      # ⭐ DEBUG STEP 2 — dump Framebuffer methods/fields
      - name: Dump Framebuffer
        run: |
          echo "Dumping Framebuffer class..."
          for jar in $(find ~/.gradle -name "*.jar"); do
            echo "Checking $jar"
            javap -classpath "$jar" net.minecraft.client.gl.Framebuffer 2>/dev/null && break
          done

      # ⭐ DEBUG STEP 3 — locate Minecraft JARs
      - name: Locate Minecraft JARs
        run: |
          echo "Searching for Minecraft client JARs..."
          find ~/.gradle -name "*minecraft*.jar" -print
          find ~/.gradle -name "*client*.jar" -print
          find ~/.gradle -name "*mapped*.jar" -print

      # ⭐ DEBUG STEP 4 — deep scan Framebuffer
      - name: Dump Framebuffer (deep scan)
        run: |
          echo "Deep scanning for Framebuffer..."
          for jar in $(find ~/.gradle -name "*.jar"); do
            javap -classpath "$jar" net.minecraft.client.gl.Framebuffer 2>/dev/null && echo "FOUND IN: $jar" && break
          done

      # ⭐ DEBUG STEP 5 — dump GpuTexture
      - name: Dump GpuTexture
        run: |
          echo "Dumping GpuTexture..."
          for jar in $(find ~/.gradle -name "*.jar"); do
            javap -classpath "$jar" com.mojang.blaze3d.textures.GpuTexture 2>/dev/null && echo "FOUND IN: $jar" && break
          done

      # ⭐ DEBUG STEP 6 — dump GpuTextureView
      - name: Dump GpuTextureView
        run: |
          echo "Dumping GpuTextureView..."
          for jar in $(find ~/.gradle -name "*.jar"); do
            javap -classpath "$jar" com.mojang.blaze3d.textures.GpuTextureView 2>/dev/null && echo "FOUND IN: $jar" && break
          done

      # ⭐ SECOND BUILD — your actual mod build
      - name: Run build
        run: ./gradlew build

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: thanatifiedcrosshairtweaks
          path: build/libs/*.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
