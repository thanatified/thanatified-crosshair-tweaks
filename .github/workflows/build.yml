name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ⭐ DEBUG STEP 1 — locate Framebuffer.class
      - name: Locate Framebuffer
        run: |
          find ~/.gradle -name "Framebuffer.class" -print || echo "Framebuffer not found"

      # ⭐ DEBUG STEP 2 — dump Framebuffer methods/fields
      - name: Dump Framebuffer
        run: |
          for jar in $(find ~/.gradle -name "*.jar"); do
            echo "Checking $jar"
            javap -classpath "$jar" net.minecraft.client.gl.Framebuffer 2>/dev/null && break
          done

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run build
        run: ./gradlew build

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: thanatifiedcrosshairtweaks
          path: build/libs/*.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
